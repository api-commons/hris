  workday: [workday-advanced-compensation, workday-integration, workday-payroll, workday-recruiting]
  adp: [automatic-data-processing]
  hibob: [bob]
  ethena: [goethena]

findings:
  - "An employee is agreed: id, work email, first and last name and status are core across
    55 providers with a readable schema -- the sharpest core of any people concept so far."
  - "Absences agree too: start, end, status, type and the employee are all core, so a
    time-off request maps cleanly between HR systems."
  - "Teams barely exist as a resource of their own (7 providers); most HR systems model
    the organisation through departments and managers instead."
decisions:
  - "Employee Benefits is not a cohort tag: benefits administration is its own domain."
  - "`roles` is not a position and `groups` is not a team: reviewed, both were permission
    roles and SCIM, LMS or payment groups far more often than an org structure."
  - "`members` is not an employee segment (workspace members, analytics dimensions)."
  - "Time off is `/absences`: absences lead (9) the spread of time-off spellings, and
    `/holidays` -- a public-holiday calendar -- is not a request and is not counted."
  - "Employment is `/employments`, though 14 providers say `jobs`: `jobs` is a job posting in
    the recruiting context. Role name over a colliding word, as with `/cardholders`."
  - "A work location is `/work-locations` for the same reason: `/locations` means a store or a
    restaurant in commerce and point of sale."
  - "Five Workday listings, two ADP, two HiBob and two Ethena listings are merged as duplicates."
