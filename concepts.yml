context: hris
name: People and HR
intro: >-
  The common HR vocabulary -- employees and their employment, the departments, teams and
  positions they sit in, the places they work, and the time off they take -- distilled from
  the APIs that already exist.
tags: [Human Resources, HRIS, HR Tech, HR, HCM, Human Capital Management, Workforce Management, People Operations]

